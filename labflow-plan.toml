# Host-provided bootstrap assets.
[artifacts.telora-bin]
assets = ["bin/telora"]

[artifacts.telora]
assets = ["telora/docs/"]

# Session qualifications. Each role learns the language once and keeps the
# resulting knowledge in its own long-lived session.
[artifacts."learn-lang.sess.a1"]
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "bin/telora"]

[artifacts."learn-lang.sess.a2"]
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "bin/telora"]

[artifacts."learn-lang.sess.a3"]
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "bin/telora"]

# Query: A1 implements; A2 and A3 review independently. Host either publishes
# the accepted public delivery or publishes consolidated feedback for A1.
[artifacts."query.a1"]
goal = "goals/query.md"
requires = ["learn-lang.sess.a1", "query-feedback?"]
inputs = ["telora/docs/"]
assets = [
  "query/docs/",
  "query/src/",
  "query/tests/",
  "query/my-feedbacks/",
]
check = [
  "query/docs/QUERY.md",
  "query/src/lib.telora",
  "query/tests/query.telora",
]

[artifacts."query-feedback.a2"]
goal = "goals/review-query-for-ontology.md"
requires = ["learn-lang.sess.a2", "query.a1"]
inputs = ["query/docs/"]
assets = ["ontology/my-feedbacks/query.md"]
check = ["ontology/my-feedbacks/query.md"]

[artifacts."query-feedback.a3"]
goal = "goals/review-query-for-ent-1.md"
requires = ["learn-lang.sess.a3", "query.a1"]
inputs = ["query/docs/"]
assets = ["ent-1/my-feedbacks/query.md"]
check = ["ent-1/my-feedbacks/query.md"]

[artifacts.query-feedback]
requires = ["query-feedback.a2", "query-feedback.a3"]
inputs = [
  "ontology/my-feedbacks/query.md",
  "ent-1/my-feedbacks/query.md",
]
assets = ["feedbacks/query.md"]
check = ["feedbacks/query.md"]

[artifacts.query]
requires = ["query.a1", "query-feedback.a2", "query-feedback.a3"]
assets = ["query/docs/"]
check = ["query/docs/QUERY.md"]

# Ontology: A2 implements against the accepted Query contract. A3 reviews it
# against the concrete enterprise-modeling requirements before Host approval.
[artifacts."ontology.a2"]
goal = "goals/ontology.md"
requires = ["learn-lang.sess.a2", "query", "ontology-feedback?"]
inputs = ["query/docs/"]
assets = [
  "ontology/docs/",
  "ontology/src/",
  "ontology/tests/",
  "ontology/my-feedbacks/",
]
check = [
  "ontology/docs/ONTOLOGY.md",
  "ontology/src/edsl.telora",
  "ontology/tests/ontology.telora",
]

[artifacts."ontology-feedback.a3"]
goal = "goals/review-ontology-for-ent-1.md"
requires = ["learn-lang.sess.a3", "query", "ontology.a2"]
inputs = ["query/docs/", "ontology/docs/"]
assets = ["ent-1/my-feedbacks/ontology.md"]
check = ["ent-1/my-feedbacks/ontology.md"]

[artifacts.ontology-feedback]
requires = ["ontology-feedback.a3"]
inputs = ["ent-1/my-feedbacks/ontology.md"]
assets = ["feedbacks/ontology.md"]
check = ["feedbacks/ontology.md"]

[artifacts.ontology]
requires = ["ontology.a2", "ontology-feedback.a3"]
assets = ["ontology/docs/"]
check = ["ontology/docs/ONTOLOGY.md"]

# Ent-1: A3 builds the private model and public query facade from the accepted
# Query and Ontology deliveries. Host directly accepts it or requests a new
# iteration through formal feedback.
[artifacts."ent-1.a3"]
goal = "goals/ent-1.md"
requires = ["learn-lang.sess.a3", "query", "ontology", "ent-1-feedback?"]
inputs = ["query/docs/", "ontology/docs/"]
assets = [
  "ent-1/docs/",
  "ent-1/src/",
  "ent-1/tests/",
  "ent-1/my-feedbacks/",
]
check = [
  "ent-1/docs/DOMAIN.md",
  "ent-1/docs/QUERY-DESIGN-GUIDE.md",
  "ent-1/src/model.telora",
  "ent-1/src/query.telora",
  "ent-1/tests/logistics.telora",
  "ent-1/tests/query-surface.telora",
]

[artifacts.ent-1-feedback]
requires = ["ent-1.a3"]
inputs = ["ent-1/docs/", "ent-1/src/", "ent-1/tests/"]
assets = ["feedbacks/ent-1.md"]
check = ["feedbacks/ent-1.md"]

[artifacts.ent-1]
requires = ["ent-1.a3"]
assets = ["ent-1/docs/"]
check = [
  "ent-1/docs/DOMAIN.md",
  "ent-1/docs/QUERY-DESIGN-GUIDE.md",
]
