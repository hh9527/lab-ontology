version = 1

[roles.foundation-next]
permissions = []

[roles.spider-modeler-next]
permissions = []

[roles.spider-modeler-v2]
permissions = []

[roles.spider-evaluator-next]
permissions = []

[roles.dog-modeler]
permissions = []

[artifacts.telora-bin]
assets = ["bin/telora"]

[artifacts.telora]
assets = ["telora/docs/", "telora-config.json", "telora-lock.json"]

[artifacts."query-core.foundation-next"]
goal = "goals/query.md"
requires = ["telora", "telora-bin", "query-feedback?"]
commands = [
  "./bin/telora -C ontology check @src/query",
  "./bin/telora -C ontology test query",
]
inputs = [
  "goals/telora-context.md",
  "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "ontology/telora-crate.json", "feedbacks/query.md",
]
assets = ["ontology/docs/QUERY.md", "ontology/src/query.telora", "ontology/tests/query.telora"]
check = ["ontology/docs/QUERY.md", "ontology/src/query.telora", "ontology/tests/query.telora"]

[artifacts."ontology.foundation-next"]
goal = "goals/ontology.md"
requires = ["telora", "telora-bin", "query-core.foundation-next", "ontology-feedback?"]
commands = [
  "./bin/telora -C ontology check @src/query",
  "./bin/telora -C ontology check @src/intent",
  "./bin/telora -C ontology test query",
  "./bin/telora -C ontology test ontology/intent",
]
inputs = [
  "goals/telora-context.md",
  "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "ontology/docs/QUERY.md", "ontology/src/query.telora", "feedbacks/ontology.md",
]
assets = [
  "ontology/docs/QUERY.md", "ontology/docs/ONTOLOGY.md", "ontology/src/query.telora",
  "ontology/src/ontology.telora", "ontology/src/intent.telora", "ontology/tests/ontology/intent/test_knowledge.telora",
  "ontology/tests/query.telora", "ontology/tests/ontology/intent.telora",
  "ontology/telora-crate.json",
]
check = [
  "ontology/telora-crate.json", "ontology/docs/QUERY.md", "ontology/docs/ONTOLOGY.md",
  "ontology/src/query.telora", "ontology/src/ontology.telora", "ontology/src/intent.telora",
  "ontology/tests/query.telora", "ontology/tests/ontology/intent.telora",
]

[artifacts.ontology-feedback]
assets = ["feedbacks/ontology.md"]
check = ["feedbacks/ontology.md"]

[artifacts.query-feedback]
assets = ["feedbacks/query.md"]
check = ["feedbacks/query.md"]

# The modeler can see only this modeling partition. The held-out eval directory
# is a separate Host artifact and never appears in modeler inputs.
[artifacts.world-modeling-source]
assets = [
  "spider-data-1/modeling/world_1.schema.json",
  "spider-data-1/modeling/world_1.examples.jsonl",
  "spider-data-1/database/world_1/world_1.sqlite",
]
check = [
  "spider-data-1/modeling/world_1.schema.json",
  "spider-data-1/modeling/world_1.examples.jsonl",
  "spider-data-1/database/world_1/world_1.sqlite",
]

[artifacts."ontology-review.spider-modeler-next"]
goal = "goals/review-ontology-for-world.md"
requires = ["telora", "telora-bin", "ontology.foundation-next", "world-modeling-source"]
inputs = [
  "goals/telora-context.md", "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "ontology/docs/", "ontology/src/", "spider-data-1/modeling/world_1.schema.json",
  "spider-data-1/modeling/world_1.examples.jsonl",
  "spider-data-1/database/world_1/world_1.sqlite",
]
assets = ["world-model/my-feedbacks/ontology.md"]
check = ["world-model/my-feedbacks/ontology.md"]

[artifacts.ontology]
requires = ["query-core.foundation-next", "ontology.foundation-next", "ontology-review.spider-modeler-next"]
assets = ["ontology/docs/", "ontology/src/intent.telora"]
check = ["ontology/docs/QUERY.md", "ontology/docs/ONTOLOGY.md", "ontology/src/intent.telora"]

[artifacts.world-make-query]
assets = ["bin/world-make-query"]
check = ["bin/world-make-query"]

[artifacts."world-model.spider-modeler-v2"]
goal = "goals/world-model.md"
requires = [
  "telora", "telora-bin", "ontology", "world-modeling-source",
  "world-model-feedback?",
]
commands = [
  "./bin/telora -C world-model check @src/model",
  "./bin/telora -C world-model check @src/bin/make-query",
  "./bin/telora -C world-model test query",
]
inputs = [
  "goals/telora-context.md",
  "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "bin/world-make-query", "ontology/docs/", "ontology/src/intent.telora",
  "spider-data-1/modeling/world_1.schema.json",
  "spider-data-1/modeling/world_1.examples.jsonl",
  "spider-data-1/database/world_1/world_1.sqlite", "feedbacks/world-model.md",
]
assets = [
  "world-model/docs/", "world-model/my-feedbacks/ontology.md", "world-model/src/",
  "world-model/tests/", "world-model/testdata/", "world-model/telora-crate.json",
]
check = [
  "world-model/telora-crate.json", "world-model/my-feedbacks/ontology.md",
  "world-model/docs/DOMAIN.md", "world-model/docs/INTENT.md", "world-model/src/model.telora",
  "world-model/src/bin/make-query.telora", "world-model/tests/query.telora",
]

[artifacts.world-model-feedback]
assets = ["feedbacks/world-model.md"]
check = ["feedbacks/world-model.md"]

[artifacts.world-eval-input]
assets = [
  "spider-data-1/eval/world_1.suite-1.jsonl",
  "spider-data-1/eval/world_1.selector.json",
]
check = [
  "spider-data-1/eval/world_1.suite-1.jsonl",
  "spider-data-1/eval/world_1.selector.json",
]

[artifacts.world-eval-run]

[artifacts."world-eval.spider-evaluator-next"]
kind = "bench"
gate = "world-eval-run"
requires = ["system-active", "world-model.spider-modeler-v2", "world-eval-input", "world-make-query"]
inputs = ["world-model/docs/", "bin/world-make-query"]

[artifacts."world-eval.spider-evaluator-next".bench]
name = "world-eval"
source = "spider-data-1/eval/world_1.suite-1.jsonl"
selector = "spider-data-1/eval/world_1.selector.json"
public-knowledge = ["world-model/docs/"]

[artifacts."world-eval.spider-evaluator-next".bench.permissions]
read = ["bin/world-make-query", "world-eval/ok.json", "world-eval/diagnostic.jsonl"]
write = ["world-eval/input.json"]
commands = ["bin/world-make-query check", "./bin/world-make-query check"]

# Cross-domain regression: the previously converged student transcript model
# remains isolated from world_1 modeling and evaluation assets.
[artifacts.spider-modeling-source]
assets = [
  "spider-data-1/modeling/student_transcripts_tracking.schema.json",
  "spider-data-1/modeling/student_transcripts_tracking.examples.jsonl",
  "spider-data-1/database/student_transcripts_tracking/student_transcripts_tracking.sqlite",
]
check = [
  "spider-data-1/modeling/student_transcripts_tracking.schema.json",
  "spider-data-1/modeling/student_transcripts_tracking.examples.jsonl",
  "spider-data-1/database/student_transcripts_tracking/student_transcripts_tracking.sqlite",
]

[artifacts.spider-make-query]
assets = ["bin/spider-make-query"]
check = ["bin/spider-make-query"]

[artifacts."spider-model.spider-modeler-next"]
goal = "goals/spider-model.md"
requires = [
  "telora", "telora-bin", "ontology", "spider-modeling-source",
  "spider-model-feedback?",
]
commands = [
  "./bin/telora -C spider-model check @src/model",
  "./bin/telora -C spider-model check @src/bin/make-query",
  "./bin/telora -C spider-model test query",
]
inputs = [
  "goals/telora-context.md",
  "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "bin/spider-make-query", "ontology/docs/", "ontology/src/intent.telora",
  "spider-data-1/modeling/student_transcripts_tracking.schema.json",
  "spider-data-1/modeling/student_transcripts_tracking.examples.jsonl",
  "spider-data-1/database/student_transcripts_tracking/student_transcripts_tracking.sqlite",
  "feedbacks/spider-model.md",
]
assets = [
  "spider-model/docs/", "spider-model/my-feedbacks/ontology.md", "spider-model/src/",
  "spider-model/tests/", "spider-model/testdata/", "spider-model/telora-crate.json",
]
check = [
  "spider-model/telora-crate.json", "spider-model/my-feedbacks/ontology.md",
  "spider-model/docs/DOMAIN.md", "spider-model/docs/INTENT.md", "spider-model/src/model.telora",
  "spider-model/src/bin/make-query.telora", "spider-model/tests/query.telora",
]

[artifacts.spider-model-feedback]
assets = ["feedbacks/spider-model.md"]
check = ["feedbacks/spider-model.md"]

[artifacts.spider-eval-input]
assets = [
  "spider-data-1/eval/student_transcripts_tracking.suite-1.jsonl",
  "spider-data-1/eval/student_transcripts_tracking.selector.json",
]
check = [
  "spider-data-1/eval/student_transcripts_tracking.suite-1.jsonl",
  "spider-data-1/eval/student_transcripts_tracking.selector.json",
]

[artifacts.spider-eval-run]

[artifacts."spider-eval.spider-evaluator-next"]
kind = "bench"
gate = "spider-eval-run"
requires = ["system-active", "spider-model.spider-modeler-next", "spider-eval-input", "spider-make-query"]
inputs = ["spider-model/docs/", "bin/spider-make-query"]

[artifacts."spider-eval.spider-evaluator-next".bench]
name = "spider-eval"
source = "spider-data-1/eval/student_transcripts_tracking.suite-1.jsonl"
selector = "spider-data-1/eval/student_transcripts_tracking.selector.json"
public-knowledge = ["spider-model/docs/"]

[artifacts."spider-eval.spider-evaluator-next".bench.permissions]
read = ["bin/spider-make-query", "spider-eval/ok.json", "spider-eval/diagnostic.jsonl"]
write = ["spider-eval/input.json"]
commands = ["bin/spider-make-query check", "./bin/spider-make-query check"]

# Complementary Spider domain: high scalar-subquery, negation, set-operation,
# and 3+ table join density. Modeling and evaluation SQL groups are isolated.
[artifacts.dog-modeling-source]
assets = [
  "spider-data-1/modeling/dog_kennels.schema.json",
  "spider-data-1/modeling/dog_kennels.examples.jsonl",
  "spider-data-1/database/dog_kennels/dog_kennels.sqlite",
]
check = [
  "spider-data-1/modeling/dog_kennels.schema.json",
  "spider-data-1/modeling/dog_kennels.examples.jsonl",
  "spider-data-1/database/dog_kennels/dog_kennels.sqlite",
]

[artifacts.dog-make-query]
