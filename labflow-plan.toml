# ICM source material and private benchmark cases are Host-owned.
[artifacts.icm-source]
assets = [
  "icm/ao/",
  "icm/eval/questions.jsonl",
  "icm/eval/selected.jsonl",
]
check = [
  "icm/ao/docs/README.md",
  "icm/ao/schema/schema.sql",
  "icm/eval/questions.jsonl",
  "icm/eval/selected.jsonl",
]

# Stable Host-provided adapter; A3 implements the fixed Telora lowering entry.
[artifacts.icm-make-query]
assets = ["bin/make-query"]
check = ["bin/make-query"]

# A3 builds the ICM ontology, its public Resolver context, and the deterministic
# intent-to-query tool. Benchmark feedback is an optional Host publication so
# the report can improve the next model iteration without introducing a cycle.
[artifacts."icm-model.a3"]
goal = "goals/icm-model.md"
requires = ["learn-lang.sess.a3", "query", "ontology", "icm-source", "icm-model-feedback?"]
inputs = [
  "query/docs/",
  "ontology/docs/",
  "icm/ao/",
  "icm/eval/report.sqlite",
  "feedbacks/icm-model.md",
]
assets = [
  "icm-model/docs/",
  "icm-model/src/",
  "icm-model/tests/",
  "icm-model/telora-crate.json",
  "icm/eval/public/DOMAIN.md",
  "icm/eval/public/QUERY-DESIGN-GUIDE.md",
]
check = [
  "icm-model/telora-crate.json",
  "icm-model/docs/DOMAIN.md",
  "icm-model/docs/QUERY-DESIGN-GUIDE.md",
  "icm-model/src/model.telora",
  "icm-model/src/query.telora",
  "icm-model/src/bin/make-query.telora",
  "icm-model/tests/query.telora",
  "icm/eval/public/DOMAIN.md",
  "icm/eval/public/QUERY-DESIGN-GUIDE.md",
]

[artifacts.icm-model-feedback]
assets = ["feedbacks/icm-model.md"]
check = ["feedbacks/icm-model.md"]

# One benchmark Task produces one SQLite report Artifact. Failed, timed-out,
# and unattempted cases remain valid report outcomes.
[artifacts."icm-eval.bench-1"]
goal = "goals/icm-benchmark.md"
requires = ["icm-model.a3", "icm-source", "icm-make-query"]
inputs = ["icm/eval/"]
assets = ["icm/eval/report.sqlite"]
check = ["icm/eval/report.sqlite"]
