version = 1

# Query and Ontology are two phases of one long-lived role. File access is
# derived per artifact; bash is needed for the project-local Telora CLI.
[roles.foundation]
permissions = ["bash"]

# ICM modeling remains a separate long-lived role.
[roles.icm-modeler]
permissions = ["bash"]

# The benchmark challenger uses Labflow's built-in bench protocol. The
# respondent receives only the public knowledge and command permissions below.
[roles.evaluator]
permissions = []

# Host-provided bootstrap assets.
[artifacts.telora-bin]
assets = ["bin/telora"]

[artifacts.telora]
assets = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
]

# Session qualifications are virtual Learn artifacts and are rebuilt whenever
# the corresponding role receives a new session.
[artifacts."learn-lang.foundation"]
kind = "learn"
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora"]

[artifacts."learn-lang.icm-modeler"]
kind = "learn"
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora"]

# Phase 1: foundation implements the domain-neutral Query core inside the unified
# ontology crate.
[artifacts."query-core.foundation"]
goal = "goals/query.md"
requires = ["learn-lang.foundation", "ontology-feedback?"]
inputs = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "ontology/telora-crate.json",
  "feedbacks/ontology.md",
]
assets = [
  "ontology/docs/QUERY.md",
  "ontology/src/query.telora",
  "ontology/tests/query.telora",
]
check = [
  "ontology/docs/QUERY.md",
  "ontology/src/query.telora",
  "ontology/tests/query.telora",
]

# Phase 2: the same foundation session builds Ontology on the Query core. Host feedback
# may trigger another integrated foundation pass.
[artifacts."ontology.foundation"]
goal = "goals/ontology.md"
requires = ["learn-lang.foundation", "query-core.foundation", "ontology-feedback?"]
inputs = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "ontology/docs/QUERY.md",
  "ontology/src/query.telora",
  "feedbacks/ontology.md",
]
assets = [
  "ontology/docs/ONTOLOGY.md",
  "ontology/src/edsl.telora",
  "ontology/src/knowledge.telora",
  "ontology/tests/ontology.telora",
  "ontology/telora-crate.json",
]
check = [
  "ontology/telora-crate.json",
  "ontology/docs/ONTOLOGY.md",
  "ontology/src/edsl.telora",
  "ontology/tests/ontology.telora",
]

[artifacts."ontology-review.icm-modeler"]
goal = "goals/review-ontology-for-icm.md"
requires = ["learn-lang.icm-modeler", "ontology.foundation", "icm-source"]
inputs = ["ontology/docs/", "ontology/src/", "icm/ao/"]
assets = ["icm-model/my-feedbacks/ontology.md"]
check = ["icm-model/my-feedbacks/ontology.md"]

[artifacts.ontology-feedback]
assets = ["feedbacks/ontology.md"]
check = ["feedbacks/ontology.md"]

[artifacts.ontology]
requires = ["query-core.foundation", "ontology.foundation", "ontology-review.icm-modeler"]
assets = ["ontology/docs/"]
check = ["ontology/docs/QUERY.md", "ontology/docs/ONTOLOGY.md"]

# Private ICM modeling source and benchmark inputs are independent Host assets.
[artifacts.icm-source]
assets = ["icm/ao/"]
check = [
  "icm/ao/docs/README.md",
  "icm/ao/schema/schema.sql",
]

[artifacts.icm-eval-input]
assets = [
  "icm/eval/suite-1.jsonl",
  "icm/eval/suite-1-b1.jsonl",
]
check = [
  "icm/eval/suite-1.jsonl",
  "icm/eval/suite-1-b1.jsonl",
]

[artifacts.icm-make-query]
assets = ["bin/make-query"]
check = ["bin/make-query"]

# icm-modeler builds the ICM ontology, its docs-only public Resolver context, and the
# deterministic intent-to-query entry. Host feedback may trigger a later pass.
[artifacts."icm-model.icm-modeler"]
goal = "goals/icm-model.md"
requires = ["learn-lang.icm-modeler", "ontology", "icm-source", "icm-model-feedback?"]
inputs = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "bin/make-query",
  "ontology/docs/",
  "icm/ao/",
  "feedbacks/icm-model.md",
]
assets = [
  "icm-model/docs/",
  "icm-model/src/",
  "icm-model/tests/",
  "icm-model/testdata/",
  "icm-model/telora-crate.json",
]
check = [
  "icm-model/telora-crate.json",
  "icm-model/docs/DOMAIN.md",
  "icm-model/src/model.telora",
  "icm-model/src/query.telora",
  "icm-model/src/bin/make-query.telora",
  "icm-model/tests/query.telora",
]

[artifacts.icm-model-feedback]
assets = ["feedbacks/icm-model.md"]
check = ["feedbacks/icm-model.md"]

# The current focus subset is the ordered source for this benchmark round.
# Labflow stores the report internally as .labflow/benchmarks/icm-eval.sqlite.
[artifacts."icm-eval.evaluator"]
kind = "bench"
requires = ["system-active", "icm-model.icm-modeler", "icm-eval-input", "icm-make-query"]
inputs = [
  "icm/eval/suite-1-b1.jsonl",
  "icm-model/docs/",
  "bin/make-query",
]

[artifacts."icm-eval.evaluator".bench]
name = "icm-eval"
source = "icm/eval/suite-1-b1.jsonl"
public-knowledge = ["icm-model/docs/"]

[artifacts."icm-eval.evaluator".bench.permissions]
read = ["bin/make-query"]
commands = [
  "bin/make-query check *",
  "./bin/make-query check *",
]
