# Help is globally safe; read-only Telora commands are confined to the crate
# owned by the long-lived role.  Review roles additionally need read-only
# exploration of the crates they consume (query / ontology), so a3 may run
# `-C query` and `-C ontology` check/eval/eval-with/query in addition to its
# own ent-1 crate.  Workspace lock updates and reducer services remain Host
# responsibilities, so roles cannot invoke lock, run, or serve.
[roles.a1]
read = [
  "goals/",
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "feedbacks/query.md",
  "query/",
]
write = ["query/"]
commands = [
  "bin/telora help",
  "bin/telora help *",
  "./bin/telora help",
  "./bin/telora help *",
  "bin/telora --help",
  "./bin/telora --help",
  "bin/telora --version",
  "./bin/telora --version",
  "bin/telora -C query check *",
  "bin/telora -C query eval *",
  "bin/telora -C query eval-with *",
  "bin/telora -C query query *",
  "./bin/telora -C query check *",
  "./bin/telora -C query eval *",
  "./bin/telora -C query eval-with *",
  "./bin/telora -C query query *",
]

[roles.a2]
read = [
  "goals/",
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "query/docs/",
  "feedbacks/ontology.md",
  "ontology/",
]
write = ["ontology/"]
commands = [
  "bin/telora help",
  "bin/telora help *",
  "./bin/telora help",
  "./bin/telora help *",
  "bin/telora --help",
  "./bin/telora --help",
  "bin/telora --version",
  "./bin/telora --version",
  "bin/telora -C ontology check *",
  "bin/telora -C ontology eval *",
  "bin/telora -C ontology eval-with *",
  "bin/telora -C ontology query *",
  "./bin/telora -C ontology check *",
  "./bin/telora -C ontology eval *",
  "./bin/telora -C ontology eval-with *",
  "./bin/telora -C ontology query *",
]

[roles.a3]
read = [
  "goals/",
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "query/docs/",
  "ontology/docs/",
  "feedbacks/ent-1.md",
  "ent-1/",
]
write = ["ent-1/"]
commands = [
  "bin/telora help",
  "bin/telora help *",
  "./bin/telora help",
  "./bin/telora help *",
  "bin/telora --help",
  "./bin/telora --help",
  "bin/telora --version",
  "./bin/telora --version",
  "bin/telora -C ent-1 check *",
  "bin/telora -C ent-1 eval *",
  "bin/telora -C ent-1 eval-with *",
  "bin/telora -C ent-1 query *",
  "./bin/telora -C ent-1 check *",
  "./bin/telora -C ent-1 eval *",
  "./bin/telora -C ent-1 eval-with *",
  "./bin/telora -C ent-1 query *",
  "bin/telora -C query check *",
  "bin/telora -C query eval *",
  "bin/telora -C query eval-with *",
  "bin/telora -C query query *",
  "./bin/telora -C query check *",
  "./bin/telora -C query eval *",
  "./bin/telora -C query eval-with *",
  "./bin/telora -C query query *",
  "bin/telora -C ontology check *",
  "bin/telora -C ontology eval *",
  "bin/telora -C ontology eval-with *",
  "bin/telora -C ontology query *",
  "./bin/telora -C ontology check *",
  "./bin/telora -C ontology eval *",
  "./bin/telora -C ontology eval-with *",
  "./bin/telora -C ontology query *",
]

[roles.a3-2]
read = [
  "goals/",
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "query/docs/",
  "ontology/docs/",
  "feedbacks/om-labflow.md",
  "om-labflow/",
]
write = ["om-labflow/"]
commands = [
  "bin/telora help",
  "bin/telora help *",
  "./bin/telora help",
  "./bin/telora help *",
  "bin/telora --help",
  "./bin/telora --help",
  "bin/telora --version",
  "./bin/telora --version",
  "bin/telora -C om-labflow check *",
  "bin/telora -C om-labflow eval *",
  "bin/telora -C om-labflow eval-with *",
  "bin/telora -C om-labflow query *",
  "./bin/telora -C om-labflow check *",
  "./bin/telora -C om-labflow eval *",
  "./bin/telora -C om-labflow eval-with *",
  "./bin/telora -C om-labflow query *",
