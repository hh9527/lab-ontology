version = 1

[roles.foundation-next]
permissions = []

[roles.spider-modeler-next]
permissions = []

[roles.spider-evaluator-next]
permissions = []

[artifacts.telora-bin]
assets = ["bin/telora"]

[artifacts.telora]
assets = ["telora/docs/", "telora-config.json", "telora-lock.json"]

[artifacts."learn-lang.foundation-next"]
kind = "learn"
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora"]

[artifacts."learn-lang.spider-modeler-next"]
kind = "learn"
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora"]

[artifacts."query-core.foundation-next"]
goal = "goals/query.md"
requires = ["learn-lang.foundation-next", "ontology-feedback?"]
commands = [
  "./bin/telora -C ontology check @src/query",
  "./bin/telora -C ontology check @test/query",
]
inputs = [
  "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "ontology/telora-crate.json", "feedbacks/ontology.md",
]
assets = ["ontology/docs/QUERY.md", "ontology/src/query.telora", "ontology/tests/query.telora"]
check = ["ontology/docs/QUERY.md", "ontology/src/query.telora", "ontology/tests/query.telora"]

[artifacts."ontology.foundation-next"]
goal = "goals/ontology.md"
requires = ["learn-lang.foundation-next", "query-core.foundation-next", "ontology-feedback?"]
commands = [
  "./bin/telora -C ontology check @src/query",
  "./bin/telora -C ontology check @test/query",
  "./bin/telora -C ontology check @test/ontology",
]
inputs = [
  "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "ontology/docs/QUERY.md", "ontology/src/query.telora", "feedbacks/ontology.md",
]
assets = [
  "ontology/docs/QUERY.md", "ontology/docs/ONTOLOGY.md", "ontology/src/query.telora",
  "ontology/src/edsl.telora", "ontology/src/knowledge.telora", "ontology/tests/query.telora",
  "ontology/tests/ontology.telora", "ontology/telora-crate.json",
]
check = [
  "ontology/telora-crate.json", "ontology/docs/QUERY.md", "ontology/docs/ONTOLOGY.md",
  "ontology/src/query.telora", "ontology/src/edsl.telora", "ontology/tests/query.telora",
  "ontology/tests/ontology.telora",
]

[artifacts.ontology-feedback]
assets = ["feedbacks/ontology.md"]
check = ["feedbacks/ontology.md"]

# The modeler can see only this modeling partition. The held-out eval directory
# is a separate Host artifact and never appears in modeler inputs.
[artifacts.spider-modeling-source]
assets = [
  "spider-data-1/modeling/concert_singer.schema.json",
  "spider-data-1/modeling/concert_singer.examples.jsonl",
  "spider-data-1/database/concert_singer/concert_singer.sqlite",
]
check = [
  "spider-data-1/modeling/concert_singer.schema.json",
  "spider-data-1/modeling/concert_singer.examples.jsonl",
  "spider-data-1/database/concert_singer/concert_singer.sqlite",
]

[artifacts."ontology-review.spider-modeler-next"]
goal = "goals/review-ontology-for-spider.md"
requires = ["learn-lang.spider-modeler-next", "ontology.foundation-next", "spider-modeling-source"]
inputs = [
  "ontology/docs/", "ontology/src/", "spider-data-1/modeling/",
  "spider-data-1/database/concert_singer/concert_singer.sqlite",
]
assets = ["spider-model/my-feedbacks/ontology.md"]
check = ["spider-model/my-feedbacks/ontology.md"]

[artifacts.ontology]
requires = ["query-core.foundation-next", "ontology.foundation-next", "ontology-review.spider-modeler-next"]
assets = ["ontology/docs/"]
check = ["ontology/docs/QUERY.md", "ontology/docs/ONTOLOGY.md"]

[artifacts.spider-make-query]
assets = ["bin/spider-make-query"]
check = ["bin/spider-make-query"]

[artifacts."spider-model.spider-modeler-next"]
goal = "goals/spider-model.md"
requires = [
  "learn-lang.spider-modeler-next", "ontology", "spider-modeling-source",
  "spider-model-feedback?",
]
commands = [
  "./bin/telora -C spider-model check @src/model",
  "./bin/telora -C spider-model check @src/query",
  "./bin/telora -C spider-model check @src/bin/make-query",
  "./bin/telora -C spider-model check @test/query",
]
inputs = [
  "telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora",
  "bin/spider-make-query", "ontology/docs/", "spider-data-1/modeling/",
  "spider-data-1/database/concert_singer/concert_singer.sqlite", "feedbacks/spider-model.md",
]
assets = [
  "spider-model/docs/", "spider-model/my-feedbacks/ontology.md", "spider-model/src/",
  "spider-model/tests/", "spider-model/testdata/", "spider-model/telora-crate.json",
]
check = [
  "spider-model/telora-crate.json", "spider-model/my-feedbacks/ontology.md",
  "spider-model/docs/DOMAIN.md", "spider-model/docs/INTENT.md", "spider-model/src/model.telora",
  "spider-model/src/query.telora", "spider-model/src/bin/make-query.telora",
  "spider-model/tests/query.telora",
]

[artifacts.spider-model-feedback]
assets = ["feedbacks/spider-model.md"]
check = ["feedbacks/spider-model.md"]

[artifacts.spider-eval-input]
assets = ["spider-data-1/eval/suite-2.jsonl"]
check = ["spider-data-1/eval/suite-2.jsonl"]

[artifacts.spider-eval-run]

[artifacts."spider-eval.spider-evaluator-next"]
kind = "bench"
gate = "spider-eval-run"
requires = ["system-active", "spider-model.spider-modeler-next", "spider-eval-input", "spider-make-query"]
inputs = ["spider-model/docs/", "bin/spider-make-query"]

[artifacts."spider-eval.spider-evaluator-next".bench]
name = "spider-eval"
source = "spider-data-1/eval/suite-2.jsonl"
public-knowledge = ["spider-model/docs/"]

[artifacts."spider-eval.spider-evaluator-next".bench.permissions]
read = ["bin/spider-make-query"]
write = ["spider-eval/input.json", "spider-eval/ok.json", "spider-eval/diagnostic.jsonl"]
commands = ["bin/spider-make-query check", "./bin/spider-make-query check"]
