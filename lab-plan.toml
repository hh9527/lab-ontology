version = 1

# Query and Ontology are two phases of one long-lived role. File access is
# derived per artifact; bash is needed for the project-local Telora CLI.
[roles.a1]
permissions = ["bash"]

# ICM modeling remains a separate long-lived role.
[roles.a3]
permissions = ["bash"]

# The benchmark challenger uses Labflow's built-in bench protocol. The
# respondent receives only the public knowledge and command permissions below.
[roles.bench-1]
permissions = []

# Host-provided bootstrap assets.
[artifacts.telora-bin]
assets = ["bin/telora"]

[artifacts.telora]
assets = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
]

# Session qualifications are virtual Learn artifacts and are rebuilt whenever
# the corresponding role receives a new session.
[artifacts."learn-lang.a1"]
kind = "learn"
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora"]

[artifacts."learn-lang.a3"]
kind = "learn"
goal = "goals/learn-lang.md"
requires = ["telora", "telora-bin"]
inputs = ["telora/docs/", "telora-config.json", "telora-lock.json", "bin/telora"]

# Phase 1: a1 implements Query and then reviews its public contract from the
# Ontology consumer's perspective in the same session.
[artifacts."query.a1"]
goal = "goals/query.md"
requires = ["learn-lang.a1", "query-feedback?"]
inputs = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "feedbacks/query.md",
]
assets = [
  "query/docs/",
  "query/src/",
  "query/tests/",
  "query/telora-crate.json",
  "query/my-feedbacks/",
]
check = [
  "query/telora-crate.json",
  "query/docs/QUERY.md",
  "query/src/lib.telora",
  "query/tests/query.telora",
]

[artifacts."query-feedback.a1"]
goal = "goals/review-query-for-ontology.md"
requires = ["learn-lang.a1", "query.a1"]
inputs = ["query/docs/"]
assets = ["ontology/my-feedbacks/query.md"]
check = ["ontology/my-feedbacks/query.md"]

[artifacts."query-feedback.a3"]
goal = "goals/review-query-for-icm.md"
requires = ["learn-lang.a3", "query.a1", "icm-source"]
inputs = ["query/docs/", "icm/ao/"]
assets = ["icm-model/my-feedbacks/query.md"]
check = ["icm-model/my-feedbacks/query.md"]

[artifacts.query-feedback]
assets = ["feedbacks/query.md"]
check = ["feedbacks/query.md"]

[artifacts.query]
requires = ["query.a1", "query-feedback.a1", "query-feedback.a3"]
assets = ["query/docs/"]
check = ["query/docs/QUERY.md"]

# Phase 2: the same a1 session implements Ontology against the accepted Query
# contract, retaining its first-phase context.
[artifacts."ontology.a1"]
goal = "goals/ontology.md"
requires = ["learn-lang.a1", "query", "ontology-feedback?"]
inputs = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "query/docs/",
  "feedbacks/ontology.md",
]
assets = [
  "ontology/docs/",
  "ontology/src/",
  "ontology/tests/",
  "ontology/telora-crate.json",
  "ontology/my-feedbacks/",
]
check = [
  "ontology/telora-crate.json",
  "ontology/docs/ONTOLOGY.md",
  "ontology/src/edsl.telora",
  "ontology/tests/ontology.telora",
]

[artifacts."ontology-feedback.a3"]
goal = "goals/review-ontology-for-icm.md"
requires = ["learn-lang.a3", "query", "ontology.a1", "icm-source"]
inputs = ["query/docs/", "ontology/docs/", "icm/ao/"]
assets = ["icm-model/my-feedbacks/ontology.md"]
check = ["icm-model/my-feedbacks/ontology.md"]

[artifacts.ontology-feedback]
assets = ["feedbacks/ontology.md"]
check = ["feedbacks/ontology.md"]

[artifacts.ontology]
requires = ["ontology.a1", "ontology-feedback.a3"]
assets = ["ontology/docs/"]
check = ["ontology/docs/ONTOLOGY.md"]

# Private ICM modeling source and benchmark inputs are independent Host assets.
[artifacts.icm-source]
assets = ["icm/ao/"]
check = [
  "icm/ao/docs/README.md",
  "icm/ao/schema/schema.sql",
]

[artifacts.icm-eval-input]
assets = [
  "icm/eval/questions.jsonl",
  "icm/eval/selected.jsonl",
]
check = [
  "icm/eval/questions.jsonl",
  "icm/eval/selected.jsonl",
]

[artifacts.icm-make-query]
assets = ["bin/make-query"]
check = ["bin/make-query"]

# a3 builds the ICM ontology, its docs-only public Resolver context, and the
# deterministic intent-to-query entry. Host feedback may trigger a later pass.
[artifacts."icm-model.a3"]
goal = "goals/icm-model.md"
requires = ["learn-lang.a3", "query", "ontology", "icm-source", "icm-model-feedback?"]
inputs = [
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "bin/make-query",
  "query/docs/",
  "ontology/docs/",
  "icm/ao/",
  "feedbacks/icm-model.md",
]
assets = [
  "icm-model/docs/",
  "icm-model/src/",
  "icm-model/tests/",
  "icm-model/telora-crate.json",
]
check = [
  "icm-model/telora-crate.json",
  "icm-model/docs/DOMAIN.md",
  "icm-model/src/model.telora",
  "icm-model/src/query.telora",
  "icm-model/src/bin/make-query.telora",
  "icm-model/tests/query.telora",
]

[artifacts.icm-model-feedback]
assets = ["feedbacks/icm-model.md"]
check = ["feedbacks/icm-model.md"]

# The current focus subset is the ordered source for this benchmark round.
# Labflow stores the report internally as .labflow/benchmarks/icm-eval.sqlite.
[artifacts."icm-eval.bench-1"]
kind = "bench"
requires = ["system-active", "icm-model.a3", "icm-eval-input", "icm-make-query"]
inputs = [
  "icm/eval/questions.jsonl",
  "icm/eval/selected.jsonl",
  "icm-model/docs/",
  "bin/make-query",
]

[artifacts."icm-eval.bench-1".bench]
name = "icm-eval"
source = "icm/eval/selected.jsonl"
public-knowledge = ["icm-model/docs/"]

[artifacts."icm-eval.bench-1".bench.permissions]
read = ["bin/make-query"]
commands = [
  "bin/make-query check *",
  "./bin/make-query check *",
]
