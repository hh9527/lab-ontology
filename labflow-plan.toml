# Help is globally safe; read-only Telora commands are confined to the crate
# owned by the long-lived role. Workspace lock updates and reducer services remain Host
# responsibilities, so roles cannot invoke lock, run, or serve.
[roles.a1]
read = [
  "goals/",
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "feedbacks/query.md",
  "query/",
]
write = ["query/"]
commands = [
  "bin/telora help",
  "bin/telora help *",
  "./bin/telora help",
  "./bin/telora help *",
  "bin/telora --help",
  "./bin/telora --help",
  "bin/telora --version",
  "./bin/telora --version",
  "bin/telora -C query check *",
  "bin/telora -C query eval *",
  "bin/telora -C query eval-with *",
  "bin/telora -C query query *",
  "./bin/telora -C query check *",
  "./bin/telora -C query eval *",
  "./bin/telora -C query eval-with *",
  "./bin/telora -C query query *",
]

[roles.a2]
read = [
  "goals/",
  "telora/docs/",
  "telora-config.json",
  "telora-lock.json",
  "bin/telora",
  "query/docs/",
  "feedbacks/ontology.md",
  "ontology/",
]
write = ["ontology/"]
commands = [
  "bin/telora help",
  "bin/telora help *",
  "./bin/telora help",
  "./bin/telora help *",
  "bin/telora --help",
  "./bin/telora --help",
  "bin/telora --version",
  "./bin/telora --version",
  "bin/telora -C ontology check *",
  "bin/telora -C ontology eval *",
  "bin/telora -C ontology eval-with *",
  "bin/telora -C ontology query *",
  "./bin/telora -C ontology check *",
  "./bin/telora -C ontology eval *",
  "./bin/telora -C ontology eval-with *",
  "./bin/telora -C ontology query *",
]

